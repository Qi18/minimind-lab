schema_version: 1
name: minimind-sft-v1-contamination
status: revisions_frozen_harness_pending
metadata_endpoint: https://hf-mirror.com

task_alignment:
  task_names:
    - ceval-valid
    - cmmlu
    - arc_easy
    - piqa
    - openbookqa
    - hellaswag
    - social_iqa
    - gsm8k
    - mbpp
  harness_commit: null
  prompt_builder_sha256: null
  note: Freeze both fields before the formal contamination audit and scoring.

matching:
  exact_min_normalized_chars: 1
  containment_min_normalized_chars: 20
  exact_overlap_max: 0
  containment_overlap_max: 0
  near_duplicate_overlap_max: 0

near_duplicate:
  seed: 42
  num_perm: 128
  char_ngram: 5
  min_normalized_chars: 20
  jaccard_threshold: 0.80
  containment_threshold: 0.90
  scope: full_final_train_validation_test

